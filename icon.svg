<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="pwaBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d05"/>
      <stop offset="50%" stop-color="#072210"/>
      <stop offset="100%" stop-color="#010602"/>
    </linearGradient>

    <!-- Neon Green Text Gradient -->
    <linearGradient id="pwaGreenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66"/>
      <stop offset="100%" stop-color="#00A651"/>
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="pwaGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259"/>
      <stop offset="100%" stop-color="#FFA751"/>
    </linearGradient>

    <!-- Inner Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d381b"/>
      <stop offset="100%" stop-color="#031208"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="pwaGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Dark Rounded Container for Phone Home Screen App Icon -->
  <rect width="512" height="512" rx="112" fill="url(#pwaBgGrad)"/>

  <!-- Outer Neon Green Border Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#00A651" stroke-width="12" stroke-opacity="0.8"/>
  <rect x="28" y="28" width="456" height="456" rx="84" fill="none" stroke="#00FF66" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Center Badge Shield Container -->
  <g transform="translate(256, 256)">
    <!-- Inner Shield Badge -->
    <rect x="-190" y="-180" width="380" height="360" rx="48" fill="url(#shieldGrad)" stroke="url(#pwaGreenGrad)" stroke-width="6" filter="url(#pwaGlow)"/>

    <!-- Inner Gold Trim -->
    <rect x="-176" y="-166" width="352" height="332" rx="36" fill="none" stroke="url(#pwaGoldGrad)" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Top Crown / Movie Star Emblem INSIDE Badge -->
    <g transform="translate(0, -110)">
      <polygon points="0,-22 7,-6 24,-6 10,4 15,20 0,10 -15,20 -10,4 -24,-6 -7,-6" fill="url(#pwaGoldGrad)"/>
    </g>

    <!-- MAIN TYPOGRAPHY: "MK HERO MOVIES" CLEARLY WRITTEN INSIDE THE LOGO -->
    <!-- Line 1: MK HERO in Vibrant Neon Green -->
    <text x="0" y="-30" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="52" fill="url(#pwaGreenGrad)" letter-spacing="3">
      MK HERO
    </text>

    <!-- Line 2: MOVIES in Crisp White & Gold -->
    <text x="0" y="38" text-anchor="middle" font-family="'Impact', 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#FFFFFF" letter-spacing="4">
      MOVIES
    </text>

    <!-- Bottom Ribbon Tag INSIDE Badge -->
    <rect x="-130" y="75" width="260" height="34" rx="17" fill="#000000" stroke="#00A651" stroke-width="2"/>
    <text x="0" y="98" text-anchor="middle" font-family="'Arial', sans-serif" font-weight="900" font-size="13" fill="url(#pwaGoldGrad)" letter-spacing="3">
      AGASOBANUYE
    </text>
  </g>
</svg>
